<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Heated Surface -->
  <rect width="100" height="100" fill="#2A0F08" />
  
  <!-- Heat Gradients -->
  <rect x="10" y="10" width="80" height="80" fill="#FF4500" opacity="0.05" />
  <rect x="30" y="30" width="40" height="40" fill="#FF8C00" opacity="0.03" />

  <!-- Bevel Edges -->
  <path d="M0 0 H100 L94 6 H6 L0 0 Z" fill="#3A1F18" />
  <path d="M0 100 H100 L94 94 H6 L0 100 Z" fill="#1A0A05" />
  
  <!-- Surface Texture -->
  <rect x="15" y="15" width="8" height="8" fill="#FF4500" opacity="0.1" />
  <rect x="77" y="77" width="8" height="8" fill="#FF4500" opacity="0.1" />
  <path d="M20 80 Q50 75 80 80" fill="none" stroke="#1A0A05" stroke-width="2" opacity="0.4" />
</svg>
