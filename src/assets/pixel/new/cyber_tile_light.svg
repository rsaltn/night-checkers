<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Tech Surface -->
  <rect width="100" height="100" fill="#0A0A20" />
  
  <!-- Glowing Segments -->
  <rect x="10" y="10" width="80" height="80" fill="#FF007F" opacity="0.03" />
  
  <!-- Outer Frame -->
  <path d="M0 0 H100 L95 5 H5 L0 0 Z" fill="#FF007F" opacity="0.1" />
  <path d="M0 100 H100 L95 95 H5 L0 100 Z" fill="#050510" />

  <!-- Grid Detail -->
  <path d="M25 0 V100 M75 0 V100 M0 25 H100 M0 75 H100" stroke="#2A2A50" stroke-width="1" opacity="0.3" />
  
  <!-- Light strips -->
  <rect x="49" y="5" width="2" height="10" fill="#FF007F" opacity="0.4" />
  <rect x="49" y="85" width="2" height="10" fill="#FF007F" opacity="0.4" />
</svg>
