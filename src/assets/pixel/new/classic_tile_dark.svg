<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Base Stone -->
  <rect width="100" height="100" fill="#2D3B2D" />
  
  <!-- Outer Bevel (Depth) -->
  <path d="M0 0 H100 L94 6 H6 L0 0 Z" fill="#1B261B" opacity="0.6" /> <!-- Top shadow -->
  <path d="M0 100 H100 L94 94 H6 L0 100 Z" fill="#3D4B3D" opacity="0.4" /> <!-- Bottom highlight -->
  <path d="M0 0 V100 L6 94 V6 L0 0 Z" fill="#1B261B" opacity="0.5" /> <!-- Left shadow -->
  <path d="M100 0 V100 L94 94 V6 L100 0 Z" fill="#3D4B3D" opacity="0.3" /> <!-- Right highlight -->

  <!-- Block Texture -->
  <rect x="12" y="12" width="24" height="24" fill="#1B261B" opacity="0.2" />
  <rect x="64" y="64" width="24" height="24" fill="#3D4B3D" opacity="0.1" />
  
  <!-- Cracks -->
  <path d="M70 15 L78 23 M82 19 L78 23 M78 23 L78 30" stroke="#1B261B" stroke-width="2" opacity="0.4" />
  <path d="M20 70 L28 78" stroke="#1B261B" stroke-width="2" opacity="0.3" />

  <!-- Inner border -->
  <rect x="6" y="6" width="88" height="88" fill="none" stroke="#1B261B" stroke-width="1" opacity="0.2" />
</svg>
